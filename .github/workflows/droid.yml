name: Droid Tag

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, edited]

jobs:
  droid:
    if: |
      (
        !endsWith(github.actor, '[bot]')
      ) &&
      (
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) ||
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      ) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body || '', '@droid')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body || '', '@droid')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body || '', '@droid')) ||
        (github.event_name == 'issues' && github.event.action == 'opened' && (contains(github.event.issue.body || '', '@droid') || contains(github.event.issue.title || '', '@droid'))) ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (contains(github.event.pull_request.body || '', '@droid') || contains(github.event.pull_request.title || '', '@droid')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run Droid Exec
        uses: Factory-AI/droid-action@e3d1f5e7861c36fe4a9c4dca3edec87b964b2bc4
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
